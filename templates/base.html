<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Tickets</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/style.css') }}">

</head>

<body>

<div class="container {% block container_class %}{% endblock %}">

{% if current_user.is_authenticated %}
<header class="usuario-actual">
    <strong>{{ current_user.NombreCompleto or current_user.Usuario }}</strong>
    <span>{{ current_user.empresa.NombreEmpresa if current_user.empresa else 'Sin empresa asignada' }}</span>
</header>
{% endif %}

{% block content %}
{% endblock %}

</div>

</body>

</html>
