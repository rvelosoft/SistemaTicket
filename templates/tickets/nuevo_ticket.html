{% extends 'base.html' %}
{% block content %}

<h2>Nuevo Ticket</h2>

<form
action="/ticket/guardar"
method="POST">

<label>Fecha Apertura</label>

<input
type="date"
name="fecha_apertura"
value="{{ fecha.strftime('%Y-%m-%d') }}">

<label>Fecha Cierre</label>

<input
type="date"
name="fecha_cierre"
value="{{ fecha.strftime('%Y-%m-%d') }}">

<label>Estado</label>

<select name="estado">

<option value="Abierto">
Abierto
</option>

<option value="En Progreso">
En Progreso
</option>

<option value="Cerrado">
Cerrado
</option>

</select>

<label>Título</label>

<input
type="text"
name="titulo">

<label>Descripción</label>

<textarea
name="descripcion">
</textarea>

<label>Total HH</label>

<input
type="number"
step="0.5"
name="total_hh">

<button type="submit">
Guardar
</button>

<a href="/menu">
Cancelar
</a>

</form>

{% endblock %}
