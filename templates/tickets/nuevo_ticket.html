{% extends 'base.html' %}
{% block content %}

<h2>Nuevo Ticket</h2>

{% if errores %}
<div class="errores" role="alert">
    <p>Revisa los siguientes campos:</p>
    <ul>
        {% for error in errores %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<form
action="{{ url_for('tickets.guardar_ticket') }}"
method="POST">

<label>Fecha Apertura</label>

<input
type="date"
name="fecha_apertura"
required
value="{{ valores.get('fecha_apertura', fecha.strftime('%Y-%m-%d')) }}">

<label>Fecha Cierre</label>

<input
type="date"
name="fecha_cierre"
required
value="{{ valores.get('fecha_cierre', fecha.strftime('%Y-%m-%d')) }}">

<label>Estado</label>

<select name="estado" required>

<option value="" {% if not valores.get('estado') %}selected{% endif %} disabled>
Selecciona un estado
</option>
<option value="Abierto" {% if valores.get('estado') == 'Abierto' %}selected{% endif %}>
Abierto
</option>

<option value="En Progreso" {% if valores.get('estado') == 'En Progreso' %}selected{% endif %}>
En Progreso
</option>

<option value="Cerrado" {% if valores.get('estado') == 'Cerrado' %}selected{% endif %}>
Cerrado
</option>

</select>

<label>Título</label>

<input
type="text"
name="titulo"
maxlength="300"
required
value="{{ valores.get('titulo', '') }}">

<label>Descripción</label>

<textarea name="descripcion">{{ valores.get('descripcion', '') }}</textarea>

<label>Total HH</label>

<input
type="number"
step="0.5"
min="0"
max="99999999.99"
name="total_hh"
required
value="{{ valores.get('total_hh', '') }}">

<button type="submit">
Guardar
</button>

<a href="/menu">
Cancelar
</a>

</form>

<script>
const fechaApertura = document.querySelector('[name="fecha_apertura"]');
const fechaCierre = document.querySelector('[name="fecha_cierre"]');

function validarFechas() {
    fechaCierre.min = fechaApertura.value;
    fechaCierre.setCustomValidity(
        fechaApertura.value &&
        fechaCierre.value &&
        fechaCierre.value < fechaApertura.value
            ? "La fecha de cierre debe ser igual o posterior a la fecha de apertura."
            : ""
    );
}

fechaApertura.addEventListener("input", validarFechas);
fechaCierre.addEventListener("input", validarFechas);
validarFechas();
</script>

{% endblock %}
